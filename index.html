<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a0524">
<title>Анита ♥</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,700&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--rose:#ff4d8d;--peach:#ffb38a;--lilac:#b48cff;--ink:#fff1f5}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font-family:Manrope,system-ui,sans-serif;overflow-x:hidden;
 background:radial-gradient(120% 80% at 50% 0%,#401152,#1a0524 55%,#0d0213) fixed}
#c{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
main{position:relative;z-index:1;pointer-events:none}
section{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8vh 7vw}
.hero{justify-content:flex-end;padding-bottom:max(10vh,60px)}
h1{margin:0;font:italic 700 clamp(84px,26vw,240px)/.9 "Cormorant Garamond",Georgia,serif;
 text-shadow:0 0 50px rgba(255,77,141,.7),0 0 120px rgba(180,140,255,.4);letter-spacing:-.02em}
h1 span{display:inline-block;opacity:0;transform:translateY(60px) scale(.8);filter:blur(14px);
 animation:rise 1.6s cubic-bezier(.2,.9,.2,1) forwards;animation-delay:calc(.5s + var(--i)*.14s)}
@keyframes rise{to{opacity:1;transform:none;filter:none}}
.hint{margin:22px 0 0;color:var(--peach);font-size:15px;opacity:0;animation:rise 1.4s 2.2s forwards,breathe 3s 3.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45}}
.big{margin:0;font:italic 500 clamp(38px,10vw,92px)/1.06 "Cormorant Garamond",Georgia,serif;max-width:14em;
 text-shadow:0 2px 40px rgba(26,5,36,.9)}
.big .w{display:inline-block;opacity:0;transform:translateY(34px);filter:blur(8px);
 transition:all 1.1s cubic-bezier(.2,.9,.2,1);transition-delay:calc(var(--i)*.09s)}
.big.in .w{opacity:1;transform:none;filter:none}
.big em{color:var(--rose);font-style:italic}
.fin h2{margin:0 0 10px;font:italic 700 clamp(40px,10vw,84px)/1 "Cormorant Garamond",Georgia,serif;text-shadow:0 0 40px rgba(255,77,141,.6)}
.cnt{margin:6px 0 28px;font-size:17px;color:var(--peach)}
.cnt b{font-size:1.5em;color:var(--ink);font-variant-numeric:tabular-nums}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;pointer-events:auto}
button{font:600 16px Manrope,sans-serif;color:var(--ink);border:0;border-radius:999px;padding:15px 26px;cursor:pointer;
 background:linear-gradient(135deg,var(--rose),#c94bff);box-shadow:0 8px 30px rgba(255,77,141,.45);
 transition:transform .25s cubic-bezier(.3,1.6,.5,1),box-shadow .25s;-webkit-tap-highlight-color:transparent}
button.alt{background:rgba(255,255,255,.1);backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.25)}
button:hover{transform:translateY(-3px) scale(1.04)}
button:active{transform:scale(.94)}
button:focus-visible{outline:3px solid var(--peach);outline-offset:3px}
#cp{min-height:3.6em;margin:30px 0 0;max-width:22em;font:italic 500 clamp(24px,5.5vw,36px)/1.2 "Cormorant Garamond",Georgia,serif;
 transition:opacity .4s,transform .4s}
#cp.out{opacity:0;transform:translateY(10px)}
.sp,.rh{position:fixed;pointer-events:none;z-index:5;user-select:none}
.sp{font-size:16px;animation:sp .9s ease-out forwards}
@keyframes sp{to{opacity:0;transform:translate(var(--dx),-40px) scale(.3) rotate(90deg)}}
.rh{top:-50px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){h1 span,.hint{animation-duration:.01s}.big .w{transition:none}}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<main>
 <section class="hero">
  <h1 aria-label="Анита"></h1>
  <p class="hint">потрогай экран — что-то случится ✨</p>
 </section>
 <section><p class="big">Ты настоящая <em>красотка.</em></p></section>
 <section><p class="big">Самая-самая. Без вариантов.</p></section>
 <section><p class="big">С тобой всё вокруг становится <em>ярче.</em></p></section>
 <section><p class="big">И я замечаю это каждый день.</p></section>
 <section class="fin">
  <h2>Анита, ты — моё любимое чудо</h2>
  <p class="cnt">Причин улыбнуться из-за тебя: <b id="n">0</b></p>
  <div class="btns">
   <button id="b1">Хочу комплимент 💖</button>
   <button id="b2" class="alt">Дождь из сердец 🌸</button>
  </div>
  <p id="cp" aria-live="polite"></p>
 </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ====== ТЕКСТЫ — меняй под себя ====== */
const NAME="Анита";
const COMPLIMENTS=[
 "У тебя самая красивая улыбка на свете.",
 "Ты делаешь мои дни лучше просто тем, что есть.",
 "Твои глаза — отдельный вид магии.",
 "Ты умная, смешная и очень красивая. Редкое сочетание.",
 "С тобой даже обычный вторник становится праздником.",
 "Ты — причина, по которой я смотрю в телефон и улыбаюсь.",
 "Ты красивая и снаружи, и внутри.",
 "Мне повезло, что ты есть в моей жизни.",
 "Если бы красоту измеряли в звёздах, ты была бы галактикой."
];
/* ===================================== */

// Имя по буквам
const h1=document.querySelector("h1");
[...NAME].forEach((ch,i)=>{const s=document.createElement("span");s.textContent=ch;s.style.setProperty("--i",i);h1.appendChild(s)});

// Слова фраз
document.querySelectorAll(".big").forEach(el=>{
 let i=0;
 const walk=n=>{[...n.childNodes].forEach(c=>{
  if(c.nodeType===3){const f=document.createDocumentFragment();
   c.textContent.split(/(\s+)/).forEach(t=>{if(!t.trim()){f.appendChild(document.createTextNode(t));return}
    const s=document.createElement("span");s.className="w";s.textContent=t;s.style.setProperty("--i",i++);f.appendChild(s)});
   n.replaceChild(f,c)}else walk(c)})};
 walk(el);
});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add("in")}),{threshold:.5});
document.querySelectorAll(".big").forEach(e=>io.observe(e));

// Счётчик
let counted=false;
new IntersectionObserver((es,o)=>{if(es[0].isIntersecting&&!counted){counted=true;
 const n=document.getElementById("n"),t0=performance.now();
 const f=t=>{const k=Math.min(1,(t-t0)/2600);n.textContent=Math.round(1000*(1-Math.pow(1-k,3)))+(k===1?"+":"");if(k<1)requestAnimationFrame(f)};
 requestAnimationFrame(f);o.disconnect()}},{threshold:.6}).observe(document.querySelector(".cnt"));

// Комплименты
let last=-1;
const cp=document.getElementById("cp");
document.getElementById("b1").onclick=()=>{
 let i;do{i=Math.floor(Math.random()*COMPLIMENTS.length)}while(i===last);last=i;
 cp.classList.add("out");
 setTimeout(()=>{cp.textContent=COMPLIMENTS[i];cp.classList.remove("out")},350);
 const r=document.getElementById("b1").getBoundingClientRect();
 emoji(r.left+r.width/2,r.top,8);
};
// Дождь сердец
function rain(n=45){
 const E=["💖","💗","💕","🌸","✨","💘","🩷"];
 for(let i=0;i<n;i++){const s=document.createElement("span");s.className="rh";s.textContent=E[i%E.length];
  s.style.left=Math.random()*100+"vw";s.style.fontSize=14+Math.random()*24+"px";
  s.style.setProperty("--r",(Math.random()*360-180)+"deg");
  s.style.animationDuration=3+Math.random()*3.5+"s";s.style.animationDelay=Math.random()*1.5+"s";
  s.onanimationend=()=>s.remove();document.body.appendChild(s)}
}
document.getElementById("b2").onclick=()=>{rain();burst(0,0,30)};
function emoji(x,y,n){for(let i=0;i<n;i++){const s=document.createElement("span");s.className="rh";s.textContent="💖";
 s.style.cssText+=`left:${x}px;top:${y}px;font-size:${14+Math.random()*14}px;animation:none;transition:none`;
 document.body.appendChild(s);
 const dx=(Math.random()-.5)*160,dy=-60-Math.random()*120;
 s.animate([{transform:"translate(0,0) scale(1)",opacity:1},{transform:`translate(${dx}px,${dy}px) scale(.4)`,opacity:0}],{duration:900+Math.random()*500,easing:"ease-out"}).onfinish=()=>s.remove()}}

// След из искорок
let lastSp=0;
addEventListener("pointermove",e=>{
 const t=performance.now();if(t-lastSp<45)return;lastSp=t;
 const s=document.createElement("span");s.className="sp";s.textContent=Math.random()<.5?"✨":"💗";
 s.style.left=e.clientX+"px";s.style.top=e.clientY+"px";s.style.setProperty("--dx",(Math.random()-.5)*40+"px");
 s.onanimationend=()=>s.remove();document.body.appendChild(s);
});

/* ====== 3D ====== */
const canvas=document.getElementById("c");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x1a0524,.028);
const camera=new THREE.PerspectiveCamera(55,1,.1,100);

// геометрия сердца
const sh=new THREE.Shape();
sh.moveTo(25,25);sh.bezierCurveTo(25,25,20,0,0,0);sh.bezierCurveTo(-30,0,-30,35,-30,35);
sh.bezierCurveTo(-30,55,-10,77,25,95);sh.bezierCurveTo(60,77,80,55,80,35);
sh.bezierCurveTo(80,35,80,0,50,0);sh.bezierCurveTo(35,0,25,25,25,25);
const hg=new THREE.ExtrudeGeometry(sh,{depth:22,bevelEnabled:true,bevelThickness:9,bevelSize:7,bevelSegments:10,curveSegments:28});
hg.center();hg.rotateZ(Math.PI);hg.scale(.045,.045,.045);

const heart=new THREE.Mesh(hg,new THREE.MeshPhysicalMaterial({color:0xff3d7f,roughness:.22,metalness:.15,clearcoat:1,clearcoatRoughness:.12,emissive:0x5a0a2a,emissiveIntensity:.8}));
scene.add(heart);

scene.add(new THREE.AmbientLight(0xffd0e0,.55));
const l1=new THREE.PointLight(0xff6fa8,2.2,40),l2=new THREE.PointLight(0xb48cff,2,40),l3=new THREE.DirectionalLight(0xffb38a,.9);
l3.position.set(-4,6,6);scene.add(l1,l2,l3);

// мини-сердечки
const mats=[0xff4d8d,0xffb38a,0xb48cff,0xff8fb8].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:.35,emissive:c,emissiveIntensity:.25}));
const floaters=[];
for(let i=0;i<30;i++){
 const m=new THREE.Mesh(hg,mats[i%4]);const s=.05+Math.random()*.16;m.scale.setScalar(s);
 m.position.set((Math.random()-.5)*20,(Math.random()-.5)*14,-12+Math.random()*13);
 m.userData={a:Math.random()*6.28,sp:.3+Math.random()*.6,ry:(Math.random()-.5)*.02,y0:m.position.y};
 scene.add(m);floaters.push(m);
}

// искры
const N=900,pos=new Float32Array(N*3);
for(let i=0;i<N;i++){const r=8+Math.random()*30,t=Math.random()*6.28,p=Math.acos(2*Math.random()-1);
 pos.set([r*Math.sin(p)*Math.cos(t),r*Math.sin(p)*Math.sin(t),r*Math.cos(p)],i*3)}
const pg=new THREE.BufferGeometry();pg.setAttribute("position",new THREE.BufferAttribute(pos,3));
const stars=new THREE.Points(pg,new THREE.PointsMaterial({color:0xffc2dc,size:.12,transparent:true,opacity:.85,blending:THREE.AdditiveBlending,depthWrite:false}));
scene.add(stars);

// взрыв сердечек по тапу
const bursts=[];
function burst(nx,ny,n=16){
 const v=new THREE.Vector3(nx,ny,.5).unproject(camera).sub(camera.position).normalize();
 const p=camera.position.clone().add(v.multiplyScalar(-camera.position.z/v.z));
 for(let i=0;i<n;i++){
  const m=new THREE.Mesh(hg,mats[i%4]);m.scale.setScalar(.06+Math.random()*.09);m.position.copy(p);
  m.userData={v:new THREE.Vector3((Math.random()-.5)*.35,(Math.random()-.2)*.35,(Math.random()-.3)*.3),s:m.scale.x,life:1};
  scene.add(m);bursts.push(m);
 }
 pulse=1;
}
let pulse=0;
addEventListener("pointerdown",e=>{
 if(e.target.closest("button"))return;
 burst(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);
});

// ввод и скролл
let px=0,py=0,tx=0,ty=0,p=0,pz=0;
addEventListener("pointermove",e=>{tx=e.clientX/innerWidth*2-1;ty=e.clientY/innerHeight*2-1});
addEventListener("deviceorientation",e=>{if(e.gamma==null)return;tx=Math.max(-1,Math.min(1,e.gamma/30));ty=Math.max(-1,Math.min(1,(e.beta-45)/30))});
function resize(){
 const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);
 camera.aspect=w/h;camera.position.z=w<700?12.5:9;camera.updateProjectionMatrix();
}
addEventListener("resize",resize);resize();

const clock=new THREE.Clock();
(function loop(){
 requestAnimationFrame(loop);
 const t=clock.getElapsedTime(),dt=Math.min(clock.getDelta(),.05);
 const max=document.documentElement.scrollHeight-innerHeight;
 const tp=max>0?scrollY/max:0;p+=(tp-p)*.07;
 px+=(tx-px)*.06;py+=(ty-py)*.06;

 // положение сердца зависит от прокрутки
 const zt=p<.5?-9*(p/.5):-9+5*((p-.5)/.5);
 pz+=(zt-pz)*.08;
 pulse*=.92;
 const beat=Math.pow(Math.max(0,Math.sin(t*3)),12)*.1+pulse*.25;
 const sc=1.15+beat;
 heart.scale.setScalar(sc);
 heart.position.set(px*.6,.9-p*.6+Math.sin(t*1.2)*.12,pz);
 heart.rotation.y=Math.sin(t*.6)*.5+px*.6+p*6.28;
 heart.rotation.x=py*.3+Math.sin(t*.8)*.08;

 l1.position.set(Math.cos(t*.8)*6,Math.sin(t*.6)*4,5);
 l2.position.set(Math.cos(t*.5+3)*7,Math.sin(t*.7+1)*4,3);
 stars.rotation.y=t*.02+p*.8;stars.rotation.x=p*.3;

 floaters.forEach(m=>{const d=m.userData;
  m.position.y=d.y0+Math.sin(t*d.sp+d.a)*.9;
  m.rotation.y+=d.ry*2;m.rotation.z=Math.sin(t*d.sp+d.a)*.3;
 });
 for(let i=bursts.length-1;i>=0;i--){const m=bursts[i],d=m.userData;
  d.life-=.014;d.v.y-=.0022;m.position.add(d.v);m.rotation.y+=.1;m.rotation.z+=.04;
  m.scale.setScalar(Math.max(.001,d.s*d.life));
  if(d.life<=0){scene.remove(m);bursts.splice(i,1)}}
 camera.position.x=px*.5;camera.position.y=-py*.35;camera.lookAt(0,0,0);
 renderer.render(scene,camera);
})();
</script>
</body>
</html>
